site_name: fdry
site_description: An independent command-line interface for Microsoft Foundry.
site_url: https://georgeollis.github.io/fdry/
repo_url: https://github.com/georgeollis/fdry
repo_name: georgeollis/fdry
edit_uri: edit/main/docs/
strict: true

theme:
  name: mkdocs
  custom_dir: overrides
  color_mode: dark
  user_color_mode_toggle: true
  highlightjs: false

extra_css:
  - assets/foundry.css

extra_javascript:
  - assets/foundry.js

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Reference: cli.md
  - Request files: request-bodies.md
  - Release guide: releasing.md
  - Contributing: https://github.com/georgeollis/fdry/blob/main/CONTRIBUTING.md
  - Security: https://github.com/georgeollis/fdry/blob/main/SECURITY.md
