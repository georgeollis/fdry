name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  quality:
    name: Code quality
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    uses: ./.github/workflows/quality.yml

  check:
    name: Tests
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    uses: ./.github/workflows/tests.yml

  package:
    name: Package installation
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    uses: ./.github/workflows/package.yml

  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    uses: ./.github/workflows/dependency-audit.yml

  required:
    name: Required CI
    if: always()
    needs: [changes, quality, check, package, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality gate
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUNTIME: ${{ needs.changes.outputs.runtime }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          assert results.pop("changes")["result"] == "success", results
          expected = "skipped" if os.environ["RUNTIME"] == "false" else "success"
          assert all(job["result"] == expected for job in results.values()), results
          print("Documentation-only change; runtime checks not needed." if expected == "skipped" else "All runtime checks passed.")
          PY
