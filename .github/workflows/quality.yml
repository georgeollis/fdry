name: Code quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python -m ruff check src tests .github/scripts
      - run: uv run --no-sync python -m ruff format --check src tests .github/scripts
      - run: uv run --no-sync python -m mypy src .github/scripts
