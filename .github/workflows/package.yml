name: Package installation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Package installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python -m build --no-isolation
      - run: uv run --no-sync python -m twine check --strict (Get-ChildItem dist -File | ForEach-Object FullName)
      - name: Install wheel outside the checkout
        run: |
          $requirements = Join-Path dist runtime-requirements.txt
          uv export --locked --no-dev --no-emit-project --output-file $requirements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $environment = Join-Path $env:RUNNER_TEMP wheel-smoke
          uv venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment bin/python
          uv pip sync --python $python $requirements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem dist -Filter '*.whl').FullName
          uv pip install --python $python --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          & $python -I -m fdry --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -m fdry --version
      - name: Prepare Python release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $release = New-Item -ItemType Directory -Path (Join-Path dist release) -Force
          Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(whl|tar\.gz)$' } | Copy-Item -Destination $release
          Get-ChildItem $release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content (Join-Path $release SHA256SUMS-python) -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: fdry-python
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
