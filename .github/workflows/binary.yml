name: Executables

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: executables-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  build:
    name: Executable (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: windows-x64
            executable: fdry.exe
            asset: fdry-windows-x64.exe
          - os: ubuntu-22.04
            target: linux-x64
            executable: fdry
            asset: fdry-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          architecture: x64
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked --all-extras
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv run --no-sync python -c "import os; from fdry import __version__; assert os.environ['GITHUB_REF_NAME'] == f'v{__version__}', 'Tag must match the package version'"
      - run: uv run --no-sync python -m ruff check src tests .github/scripts
      - run: uv run --no-sync python -m ruff format --check src tests .github/scripts
      - run: uv run --no-sync python -m mypy src .github/scripts
      - run: uv run --no-sync python -m pytest -q -m "not binary"
      - run: uv run --no-sync pip-audit --skip-editable
      - name: Install Wine for Windows packaging
        if: matrix.target == 'windows-x64'
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          curl --fail --location --retry 3 https://dl.winehq.org/wine-builds/winehq.key --output "$RUNNER_TEMP/winehq.asc"
          echo "d965d646defe94b3dfba6d5b4406900ac6c81065428bf9d9303ad7a72ee8d1b8  $RUNNER_TEMP/winehq.asc" | sha256sum --check
          sudo install -D -m 644 "$RUNNER_TEMP/winehq.asc" /etc/apt/keyrings/winehq.asc
          echo "deb [signed-by=/etc/apt/keyrings/winehq.asc] https://dl.winehq.org/wine-builds/ubuntu/ noble main" | sudo tee /etc/apt/sources.list.d/winehq.list
          sudo apt-get update
          sudo apt-get install --yes --install-recommends winehq-stable=11.0.0.0~noble-1 xvfb xauth
          wine --version
      - name: Build and test Windows executable under Wine
        if: matrix.target == 'windows-x64'
        shell: bash
        env:
          WINEPREFIX: ${{ runner.temp }}/fdry-wine
        run: xvfb-run --auto-servernum bash packaging/build-windows.sh
      - name: Build Linux executable
        if: matrix.target == 'linux-x64'
        run: uv run --no-sync python -m PyInstaller --noconfirm --clean --log-level WARN (Join-Path packaging fdry.spec)
      - name: Exercise standalone executable
        if: matrix.target == 'linux-x64'
        run: |
          $env:FDRY_EXE = (Resolve-Path (Join-Path dist '${{ matrix.executable }}')).Path
          uv run --no-sync python -m pytest -q (Join-Path tests binary)
      - name: Build Python distributions
        if: matrix.target == 'linux-x64'
        run: |
          uv run --no-sync python -m build --no-isolation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python -m twine check --strict (Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(whl|tar\.gz)$' } | ForEach-Object FullName)
      - name: Prepare release assets
        run: |
          $release = New-Item -ItemType Directory -Path (Join-Path dist release) -Force
          Copy-Item (Join-Path dist '${{ matrix.executable }}') (Join-Path $release '${{ matrix.asset }}')
          Copy-Item LICENSE (Join-Path $release LICENSE)
          if ('${{ matrix.target }}' -eq 'linux-x64') {
            Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(whl|tar\.gz)$' } | Copy-Item -Destination $release
          }
          Get-ChildItem $release -File | Where-Object Name -ne LICENSE | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content (Join-Path $release 'SHA256SUMS-${{ matrix.target }}') -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdry-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required executables
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both platform builds and tests
        env:
          RESULT: ${{ needs.build.result }}
          CHANGES: ${{ needs.changes.result }}
          RUNTIME: ${{ needs.changes.outputs.runtime }}
        run: |
          if ($env:CHANGES -ne 'success') { throw 'Change detection failed.' }
          if ($env:RUNTIME -eq 'false') {
            if ($env:RESULT -ne 'skipped') { throw 'Unexpected executable job result.' }
            Write-Output 'Documentation-only change; executable builds not needed.'
            exit 0
          }
          if ($env:RESULT -ne 'success') { throw 'Executable validation failed.' }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, required]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fdry-*
          merge-multiple: true
          path: release
      - name: Combine checksums
        run: |
          Get-ChildItem release -Filter 'SHA256SUMS-*' | Get-Content | Sort-Object | Set-Content (Join-Path release SHA256SUMS) -Encoding ascii
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = Get-ChildItem release -File | Where-Object Name -NotLike 'SHA256SUMS-*' | ForEach-Object FullName
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --draft --generate-notes --title "$env:GITHUB_REF_NAME"
