name: Executables

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: executables-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  build:
    name: Executable (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.runtime != 'false'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            executable: fdry.exe
            asset: fdry-windows-x64.exe
          - os: ubuntu-22.04
            target: linux-x64
            executable: fdry
            asset: fdry-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          architecture: x64
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked --extra dev --extra binary
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv run --no-sync python -c "import os; from fdry import __version__; assert os.environ['GITHUB_REF_NAME'] == f'v{__version__}', 'Tag must match the package version'"
      - run: uv run --no-sync python -m PyInstaller --noconfirm --clean --log-level WARN (Join-Path packaging fdry.spec)
      - name: Exercise standalone executable
        run: |
          $env:FDRY_EXE = (Resolve-Path (Join-Path dist '${{ matrix.executable }}')).Path
          uv run --no-sync python -m pytest -q (Join-Path tests binary)
      - name: Prepare release assets
        run: |
          $release = New-Item -ItemType Directory -Path (Join-Path dist release) -Force
          Copy-Item (Join-Path dist '${{ matrix.executable }}') (Join-Path $release '${{ matrix.asset }}')
          Copy-Item LICENSE (Join-Path $release LICENSE)
          Get-ChildItem $release -File | Where-Object Name -ne LICENSE | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content (Join-Path $release 'SHA256SUMS-${{ matrix.target }}') -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdry-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required executables
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both platform builds and tests
        env:
          RESULT: ${{ needs.build.result }}
          CHANGES: ${{ needs.changes.result }}
          RUNTIME: ${{ needs.changes.outputs.runtime }}
        run: |
          if ($env:CHANGES -ne 'success') { throw 'Change detection failed.' }
          if ($env:RUNTIME -eq 'false') {
            if ($env:RESULT -ne 'skipped') { throw 'Unexpected executable job result.' }
            Write-Output 'Documentation-only change; executable builds not needed.'
            exit 0
          }
          if ($env:RESULT -ne 'success') { throw 'Executable validation failed.' }
