name: Windows executable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/binary.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
      - run: python -m pip install ".[dev,binary]"
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c "import os; from fdry import __version__; assert os.environ['GITHUB_REF_NAME'] == f'v{__version__}', 'Tag must match the package version'"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy src
      - run: python -m pytest -q -m "not binary"
      - run: python -m PyInstaller --noconfirm --clean --log-level WARN packaging\fdry.spec
      - name: Exercise standalone executable
        run: |
          $env:FDRY_EXE = (Resolve-Path dist\fdry.exe).Path
          python -m pytest -q tests\binary
      - name: Prepare release assets
        run: |
          New-Item -ItemType Directory -Path dist\release -Force | Out-Null
          Copy-Item dist\fdry.exe dist\release\fdry-windows-x64.exe
          Copy-Item LICENSE dist\release\LICENSE
          $hash = (Get-FileHash dist\release\fdry-windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  fdry-windows-x64.exe" | Set-Content dist\release\SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: fdry-windows-x64
          path: dist\release\
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fdry-windows-x64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" release\fdry-windows-x64.exe release\SHA256SUMS release\LICENSE --verify-tag --draft --generate-notes --title "$env:GITHUB_REF_NAME"
