name: Bug report
description: Report a reproducible CLI problem without secrets or private resource data.
body:
  - type: textarea
    id: environment
    attributes:
      label: Version and platform
      description: Include fdry --version, OS/architecture, and Python or standalone executable installation.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal command and request body using placeholders. Remove tokens, keys, subscription IDs, resource names, and private prompts/data.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include sanitized stderr and exit status. Report vulnerabilities privately instead of here.
    validations:
      required: true
